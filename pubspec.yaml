name: univ_tiaret
description: "Univ Tiaret - University Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  form_field_validator: ^1.1.0
  animations: ^2.0.11
  flutter_riverpod: ^2.6.1
  http: ^1.2.0
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5
  crypto: ^3.0.6
  device_info_plus: ^13.1.3
  connectivity_plus: ^6.1.0
  flutter_local_notifications: ^18.0.1
  sqflite: ^2.4.3
  path: ^1.9.0
  shimmer: ^3.0.0

  path_provider: ^2.1.0
  encrypt: ^5.0.0
  pdfrx: ^2.4.7
  table_calendar: ^3.1.3
  open_filex: ^4.3.2
  docx_file_viewer: ^1.0.1
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  wakelock_plus: ^1.7.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Plus Jakarta
      fonts:
        - asset: assets/fonts/plus_jakarta/PlusJakartaDisplay-Regular.otf
        - asset: assets/fonts/plus_jakarta/PlusJakartaDisplay-Medium.otf
          weight: 500
        - asset: assets/fonts/plus_jakarta/PlusJakartaDisplay-Bold.otf
          weight: 700
    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo/Cairo-Regular.ttf
    - family: Grandis Extended
      fonts:
        - asset: assets/fonts/grandis_extended/GrandisExtended-Regular.ttf
        - asset: assets/fonts/grandis_extended/GrandisExtended-Thin.ttf
          weight: 300
        - asset: assets/fonts/grandis_extended/GrandisExtended-Medium.ttf
          weight: 500
        - asset: assets/fonts/grandis_extended/GrandisExtended-Bold.ttf
          weight: 700
        - asset: assets/fonts/grandis_extended/GrandisExtended-Black.ttf
          weight: 900
